<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create your account</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: { extend: {
    colors: {
      "surface-container-low":"#f3f3f6","on-primary-container":"#5e7400",
      "surface-container-lowest":"#ffffff","primary":"#526600",
      "outline-variant":"#c5c9ad","on-primary-fixed":"#171e00",
      "primary-container":"#d4ff33","primary-fixed":"#c8f323",
      "on-background":"#1a1c1e","on-surface":"#1a1c1e",
      "on-surface-variant":"#444934","secondary":"#5d5f5f",
      "surface-container":"#eeeef0","surface-variant":"#e2e2e5",
      "error":"#ba1a1a","error-container":"#ffdad6","on-error-container":"#93000a",
      "background":"#f9f9fc","on-primary":"#ffffff",
      "on-primary-fixed-variant":"#3d4d00","surface-container-highest":"#e2e2e5"
    },
    borderRadius:{ DEFAULT:"1rem", lg:"2rem", xl:"3rem", full:"9999px" },
    spacing:{ xs:"8px", sm:"12px", md:"16px", lg:"24px", xl:"32px",
              "container-margin":"20px", base:"4px", "card-gap":"12px" },
    fontFamily:{ "headline-sm":["Hanken Grotesk"], "body-md":["Hanken Grotesk"],
                 "display-lg-mobile":["Hanken Grotesk"], "label-bold":["Plus Jakarta Sans"],
                 "label-sm":["Plus Jakarta Sans"] },
    fontSize:{
      "headline-sm":["20px",{lineHeight:"28px",fontWeight:"600"}],
      "body-md":["16px",{lineHeight:"24px",fontWeight:"400"}],
      "display-lg-mobile":["28px",{lineHeight:"36px",fontWeight:"800"}],
      "label-bold":["14px",{lineHeight:"20px",letterSpacing:".02em",fontWeight:"700"}],
      "label-sm":["12px",{lineHeight:"16px",fontWeight:"500"}]
    }
  }}
}
</script>
<style>
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
</style>
</head>
<body class="bg-background text-on-background antialiased min-h-screen flex flex-col items-center justify-center p-4">

<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.05)] overflow-hidden flex flex-col relative h-[850px] max-h-[92vh]">

  <!-- Header, matching page1.html -->
  <div class="relative pt-xl pb-lg px-container-margin overflow-hidden min-h-[200px] flex flex-col justify-end bg-primary-fixed/20">
    <div class="mt-lg relative z-10">
      <h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface" id="title">Create your account</h1>
      <p class="font-body-md text-body-md text-on-surface-variant mt-xs" id="subtitle">
        This step is missing from the mockups — the app needs it before onboarding.
      </p>
    </div>
  </div>

  <!-- Form -->
  <div class="flex-1 overflow-y-auto px-container-margin pb-[120px] flex flex-col gap-lg pt-lg">

    <div class="flex flex-col gap-sm">
      <label class="font-label-bold text-label-bold text-on-surface" for="email">Email</label>
      <input id="email" type="email" autocomplete="off" placeholder="you@example.com"
        class="w-full bg-surface-container-low border-none rounded-lg px-md py-sm font-body-md text-body-md
               text-on-surface focus:ring-2 focus:ring-primary-fixed focus:outline-none transition-all">
    </div>

    <div class="flex flex-col gap-sm">
      <label class="font-label-bold text-label-bold text-on-surface" for="password">Password</label>
      <input id="password" type="password" autocomplete="off" value="a good long passphrase"
        class="w-full bg-surface-container-low border-none rounded-lg px-md py-sm font-body-md text-body-md
               text-on-surface focus:ring-2 focus:ring-primary-fixed focus:outline-none transition-all">
      <p class="font-label-sm text-label-sm text-on-surface-variant">
        At least 10 characters. Known-breached passwords are rejected.
      </p>
    </div>

    <div id="banner" class="hidden rounded-lg px-md py-sm font-body-md text-body-md"></div>

    <div id="session" class="hidden flex-col gap-sm bg-surface-container-low rounded-lg p-md">
      <p class="font-label-bold text-label-bold text-on-surface-variant uppercase">Signed in</p>
      <p class="font-label-sm text-label-sm text-on-surface break-all" id="who"></p>
      <div class="flex gap-xs mt-xs">
        <button onclick="go('/ui/1')"
          class="px-md py-sm rounded-full bg-primary-fixed/20 border border-primary-fixed
                 font-label-sm text-label-sm text-on-primary-fixed-variant">Continue to onboarding →</button>
        <button onclick="doLogout()"
          class="px-md py-sm rounded-full bg-surface-container border border-outline-variant
                 font-label-sm text-label-sm text-on-surface-variant">Log out</button>
      </div>
    </div>
  </div>

  <!-- Sticky action, matching page1.html -->
  <div class="absolute bottom-0 left-0 right-0 p-container-margin bg-gradient-to-t
              from-surface-container-lowest via-surface-container-lowest to-transparent pb-lg flex flex-col gap-xs">
    <button id="primary" onclick="submit()"
      class="w-full bg-primary-fixed text-on-primary-fixed font-label-bold text-label-bold py-md rounded-full
             shadow-lg hover:opacity-90 active:scale-95 transition-all flex items-center justify-center gap-xs">
      <span id="primaryLabel">Create account</span>
      <span class="material-symbols-outlined">arrow_forward</span>
    </button>
    <button onclick="toggleMode()" class="w-full py-sm font-label-sm text-label-sm text-on-surface-variant">
      <span id="toggleLabel">Already have an account? Log in</span>
    </button>
  </div>
</div>

<script>
let mode = "signup";
const DEVICE = "browser-" + (localStorage.getItem("did") || (() => {
  const d = Math.random().toString(36).slice(2, 10); localStorage.setItem("did", d); return d;
})());

const $ = id => document.getElementById(id);

function toggleMode() {
  mode = mode === "signup" ? "login" : "signup";
  $("title").textContent = mode === "signup" ? "Create your account" : "Welcome back";
  $("subtitle").textContent = mode === "signup"
    ? "This step is missing from the mockups — the app needs it before onboarding."
    : "Sign in to continue.";
  $("primaryLabel").textContent = mode === "signup" ? "Create account" : "Log in";
  $("toggleLabel").textContent = mode === "signup"
    ? "Already have an account? Log in" : "Need an account? Sign up";
  banner(null);
}

function banner(msg, kind) {
  const el = $("banner");
  if (!msg) { el.className = "hidden"; return; }
  el.textContent = msg;
  el.className = kind === "error"
    ? "rounded-lg px-md py-sm font-body-md text-body-md bg-error-container text-on-error-container"
    : "rounded-lg px-md py-sm font-body-md text-body-md bg-primary-fixed/20 text-on-primary-fixed-variant";
}

function go(path) { window.location.href = path; }

async function submit() {
  const email = $("email").value.trim();
  const password = $("password").value;
  if (!email) { banner("Enter an email address.", "error"); return; }

  $("primary").disabled = true;
  banner(mode === "signup" ? "Creating account…" : "Signing in…");

  const res = await fetch(`/v1/auth/${mode}`, {
    method: "POST",
    headers: {"Content-Type": "application/json", "X-Device-Id": DEVICE},
    body: JSON.stringify({email, password}),
  });
  const data = await res.json();
  $("primary").disabled = false;

  if (!res.ok) {
    banner(data.error?.message || `Request failed (${res.status})`, "error");
    return;
  }

  localStorage.setItem("access_token", data.access_token);
  localStorage.setItem("refresh_token", data.refresh_token);
  banner(mode === "signup" ? "Account created." : "Signed in.");
  $("who").textContent = `user ${data.user_id || "(existing)"} · token expires ${data.access_expires_at.slice(11,19)} UTC`;
  $("session").className = "flex flex-col gap-sm bg-surface-container-low rounded-lg p-md";
}

async function doLogout() {
  await fetch("/v1/auth/logout", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-Device-Id": DEVICE,
      "Authorization": "Bearer " + localStorage.getItem("access_token"),
    },
    body: JSON.stringify({refresh_token: localStorage.getItem("refresh_token")}),
  });
  localStorage.removeItem("access_token");
  localStorage.removeItem("refresh_token");
  $("session").className = "hidden";
  banner("Signed out.");
}
</script>
</body>
</html>
